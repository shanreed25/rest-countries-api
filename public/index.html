<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST Countries API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <header>
        <div>
            <!-- title as a link back home -->
            <a href="">REST Countries API</a>

            <!-- theme toggle button -->
            <button type="button" >
                <!-- focusable="false" stops older browsers from adding the SVG as an extra tab stop -->
                <svg class="theme-toggle-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <!-- Dark Mode is the button’s accessible name, so the SVG gets aria-hidden="true" and no label of its own -->
                 <!-- gives theme.js an easy target in Phase 9 when swapping the text to “Light Mode” -->
                <span class="theme-toggle">Dark Mode</span>
            </button>
        </div>
    </header>

    <main id="main">

        <!-- Home View -->
        <div>
            <h1 class="hidden-values">Countries</h1>
            <search>
                <div>
                    <label for="country-search"></label>
                    <input id="country-search" name="country-search" type="search" placeholder="Search for a country...">
                </div>
                <div>
                    <label for="region"></label>
                    <select name="region" id="region">
                        <option value=""></option>
                        <option value="Africa">Africa</option>
                        <option value="Americas">Americas</option>
                        <option value="Asia">Asia</option>
                        <option value="Europe">Europe</option>
                        <option value="Oceania">Oceania</option>
                    </select>
                </div>
            </search>
            <!------------------------ Home View ------------------------>
            <section>
                <ul id= "countries-list" class="country-card-grid">
                    
                </ul>
            </section>

            <!------------------------ Details View ------------------------>
            <section>
                
                 <button>Back</button>

                 <article>
                    <img src="" alt="">
                    <div>
                        <h1>Country Name</h1>
                        <div>
                            <h2>Country Details</h2>
                        </div>
                    </div>

                    <div>
                        <h2>Border Countries</h2>
                    </div>
                    
                 </article>
            </section>
        </div>


    </main>

</body>
</html>
